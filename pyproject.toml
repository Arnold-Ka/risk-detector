# Manifeste du projet, géré par uv (`uv add <pkg>` réécrit le tableau des
# dépendances — garder les commentaires HORS de ce tableau ou ils seront
# perdus).
# Python 3.14 : aligné sur le .venv existant (créé par uv 0.11.7).

[project]
name = "risk-detector"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",           # framework d'API (pile de la feuille de route)
    "httpx>=0.28.1",              # client HTTP pour app/edgar/client.py (+ FastAPI TestClient)
    "psycopg[binary]>=3.3.6",     # pilote PostgreSQL, SQL brut (pas d'ORM, par choix)
    "pydantic-settings>=2.15.0",  # .env -> settings typés (app/config.py)
    "pytest>=9.1.1",              # lanceur de tests (répertoire tests/ à créer)
    "pyyaml>=6.0.3",              # futur app/normalize/xbrl_map.yaml
    "requests>=2.34.2",           # gardé pour les scripts synchrones simples ; préférer httpx dans app/
    "uvicorn[standard]>=0.54.0",  # serveur ASGI lançant app.api.main:app
]

# Configuration pytest : les tests sont cherchés sous tests/ (PAS dans app/ —
# sans testpaths, pytest explorerait aussi le bruit de .venv).
# NOTE : tests/ n'existe pas encore ; `uv run pytest` ne collecte rien
# (code de sortie 5) tant que le premier fichier de test n'est pas ajouté.
[tool.pytest.ini_options]
testpaths = ["tests"]
