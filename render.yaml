# Blueprint Render : l'API FastAPI du détecteur (plan gratuit).
# Détails, comptes et étapes complets : docs/DEPLOY.md.
#
# Choisissez la RÉGION au même endroit que votre projet Neon (Ohio =
# us-east_2 des deux côtés pour un maximum de proximité) : modifiable
# après création dans le dashboard Render.
services:
  - type: web
    name: risk-detector-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true # un push sur master redéploie l'API
    envVars:
      # Chaîne Neon « pooled » (endpoint pooler, sslmode=require).
      # Saisie à la création : sync: false = valeur demandée au déploiement.
      - id: DATABASE_URL
        sync: false
      # Nom + e-mail réels exigés par les conditions d'utilisation SEC.
      # L'API n'effectue aucune requête SEC ; cette valeur satisfait
      # uniquement app/config.py au démarrage.
      - id: SEC_USER_AGENT
        sync: false
      # Jamais utilisé par l'API, mais app/config.py exige la variable.
      - id: CACHE_DIR
        value: data/cache
      # Origines du site autorisées pour les appels navigateur à l'API.
      - id: FRONTEND_ORIGINS
        sync: false
      # Secret partagé seulement avec les route handlers serveur de Vercel.
      - id: WATCHLIST_API_SECRET
        sync: false
