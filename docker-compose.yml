# PostgreSQL 17 pour le développement local.
# Amorçage : au PREMIER démarrage d'un volume vierge, l'entrypoint exécute
# tous les *.sql montés dans /docker-entrypoint-initdb.d/ — c'est ainsi que
# app/db/schema.sql crée les 7 tables. Rejouer un changement de schéma
# impose `docker compose down -v` (détruire le volume) tant qu'il n'existe
# pas de vraies migrations.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: risk        # identifiants de dev uniquement, jamais en prod
      POSTGRES_DB: risks             # doit correspondre au nom de DB de DATABASE_URL
    ports:
      # 5435 (hôte) -> 5432 (conteneur) : 5432 est déjà pris par un autre
      # conteneur local (fa_pg_sql). DATABASE_URL doit donc dire 5435.
      - "5435:5432"
    volumes:
      # Volume nommé = les données survivent à `docker compose down`, sont
      # perdues avec `down -v`.
      # La cible doit être EXACTEMENT /var/lib/postgresql/data (PGDATA) ; une
      # coquille ici désactive silencieusement la persistance car postgres
      # écrit ailleurs.
      - pgdata:/var/lib/postgresql/data
      # Montage du schéma pour qu'initdb l'applique au premier boot.
      # Si le chemin hôte est absent, Docker crée un RÉPERTOIRE vide à sa
      # place et initdb échoue dessus — garder le fichier réel.
      - ./app/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      # `docker compose up -d --wait` bloque jusqu'à ce que ce test passe ;
      # un appel pg_isready invalide (ex. `-U` sans valeur) ferait attendre
      # --wait indéfiniment. L'utilisateur (-U) et la base (-d) doivent
      # correspondre au bloc environment ci-dessus.
      test: ["CMD-SHELL", "pg_isready -U risk -d risks"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
